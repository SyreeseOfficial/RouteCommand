# build.mjs bundles + minifies into dist/ (sources stay readable in git); esbuild is pinned in package.json
[build]
  command = "npm run build"
  publish = "dist"

# No filename hashing, so keep the cache short: fast repeat loads, updates within 5 minutes
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# The service worker must always be re-checked or updates never arrive
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
